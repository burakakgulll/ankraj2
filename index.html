<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2126">
<title>Ankraj plakaları – TRİBÜN ANKRAJ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<style>
:root{
  --paper:#F4F5F3; --surface:#FFFFFF; --ink:#1C2126; --muted:#5B6570; --line:#D5D9DD;
  --slab:#E3E6E8; --accent:#FFC400; --accent-ink:#1C2126; --ok:#12804A; --warn:#B3261E;
  --sA:#C62828; --sB:#1F5FD6; --off:#C2185B; --offbg:#C2185B;
  --t48:#4C8BF5; --t49:#F29D38; --t50:#2EAD5B; --t51:#A35BD6; --t90:#E0483E;
  --str:#4A525A; --ghost:#D3D6D9; --ghost-line:#B9BEC3; --aln:#7B4FD0;
  --bar:#1C2126; --bar-ink:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181C; --surface:#1D2329; --ink:#ECEFF1; --muted:#9AA4AE; --line:#343C44;
    --slab:#232A31; --off:#F06292; --offbg:#D81B60; --str:#AEB7C0; --ghost:#2C333A; --ghost-line:#3E464E; --aln:#B39DFF; --bar:#0E1114; --bar-ink:#ECEFF1; --sB:#5B8FF0; --sA:#EF5350;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181C; --surface:#1D2329; --ink:#ECEFF1; --muted:#9AA4AE; --line:#343C44;
  --slab:#232A31; --off:#F06292; --offbg:#D81B60; --str:#AEB7C0; --ghost:#2C333A; --ghost-line:#3E464E; --aln:#B39DFF; --bar:#0E1114; --bar-ink:#ECEFF1; --sB:#5B8FF0; --sA:#EF5350;
  color-scheme: dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--bar);color:var(--bar-ink);padding:10px 14px;display:flex;align-items:baseline;gap:10px;flex:none}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
header span{font-size:13px;opacity:.7}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}

/* ---------- PLAN ---------- */
#v-plan{flex-direction:column}
.rule{background:var(--accent);color:var(--accent-ink);font-size:14px;padding:7px 14px;flex:none;line-height:1.35}
.rule b{font-weight:700}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.mapwrap{flex:1;min-width:0;min-height:0;position:relative}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block;cursor:grab}
#map text{font-family:inherit;pointer-events:none}
#map text.offlab{paint-order:stroke;stroke:var(--paper);stroke-linejoin:round;fill:var(--off);font-weight:800}
@media (prefers-reduced-motion:no-preference){#map .blink{animation:blink 1.4s ease-in-out infinite}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
#map text.on{paint-order:stroke;stroke:var(--accent);stroke-linejoin:round;font-weight:800;fill:#1C2126}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.turn{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
@media (orientation:landscape){.turn{display:none}}
.stage:has(.panel:not(.empty)) .turn{display:none}

.panel{flex:none;background:var(--surface);border-top:1px solid var(--line);height:42%;overflow:auto;padding:14px 16px 18px;position:relative}
.panel.empty{height:auto}
@media (orientation:landscape) and (min-width:600px){
  .stage{flex-direction:row}
  .panel{height:auto;width:340px;border-top:0;border-left:1px solid var(--line)}
  .panel.empty{width:240px}
  .panel .pbody{grid-template-columns:1fr}
  .panel .pbody .mini{order:-1;max-width:150px}
}
.hint{color:var(--muted);font-size:15px;margin:0}
.hint b{color:var(--ink)}
.close{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--muted)}
.ptitle{display:flex;align-items:center;gap:10px;margin:0 44px 10px 0}
.chip{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.35);flex:none}
.ptitle h2{font-size:22px;margin:0;line-height:1.1}
.ptitle small{font-size:14px;color:var(--muted);display:block;font-weight:400}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 12px;font-size:15.5px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:700;font-size:17px}
dl.facts dd small{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
.big{font-size:20px;font-weight:700}
.mini{display:block;width:100%;max-width:220px;height:auto;margin:4px auto 10px}
.pbody{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:start}
.pbody .mini{margin:0}
dl.facts{grid-template-columns:auto 1fr}
.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14.5px;margin:4px 0 10px}
.nbr{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:6px;margin:2px 0 2px}
.nbtn{min-width:52px;min-height:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15.5px;padding:0 8px}
.nbtn.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nbtn.none{color:var(--muted);font-weight:400}
.nd{text-align:center;font-weight:700;font-size:15.5px;border-bottom:2px solid var(--line);padding-bottom:2px}
.nbcap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.offc,.card .note.offc{color:var(--off)}
.badge{display:inline-block;background:color-mix(in srgb,var(--off) 12%,transparent);color:var(--off);border:1px solid var(--off);border-radius:6px;padding:0 6px;font-weight:800;font-size:14px;line-height:1.35;white-space:nowrap}
.offbanner{background:color-mix(in srgb,var(--off) 12%,var(--surface));color:var(--off);border-left:5px solid var(--off);border-radius:8px;padding:8px 12px;font-weight:800;font-size:17px;margin:0 0 10px}
.offbanner small{display:block;font-weight:500;font-size:14px;color:var(--ink);margin-top:2px}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.plist button{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:14.5px}
.plist .chip{width:14px;height:14px}

/* ---------- LİSTE / POZ / GÖNYE ---------- */
.scroll{flex:1;overflow:auto;padding:14px 14px 28px;-webkit-overflow-scrolling:touch}
.scroll>*{max-width:760px;margin-left:auto;margin-right:auto}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.row h3{margin:0;font-size:15px;padding:9px 12px;background:color-mix(in srgb,var(--accent) 35%,var(--surface));display:flex;justify-content:space-between;gap:8px}
.row h3 span{font-weight:400;color:var(--ink);opacity:.75}
.item{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 12px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .go{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;min-height:44px}
.item .go b{min-width:28px}
.item .go .meta{color:var(--muted);font-size:14px}
.item .go .dg{margin-left:auto;font-weight:700;font-size:14.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:8px}
.card p{margin:2px 0;font-size:14.5px;color:var(--muted)}
.card .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.card .pair figure{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.card .note{color:var(--warn);font-weight:600;font-size:14px;margin-top:6px}
.lead{font-size:15px;color:var(--muted);margin:0 0 12px}
.gtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.gtable th{text-align:left;font-size:14px;padding:9px 12px;background:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.gtable td{padding:9px 12px;border-top:1px solid var(--line);font-size:15px}
.gtable td:first-child{font-weight:700;width:52px}
.gtable td:last-child{text-align:right;font-weight:700;font-size:16px}
.gtable td.sub{color:var(--muted);font-size:14px}
#gsvg text{paint-order:stroke;stroke:var(--surface);stroke-width:120px;stroke-linejoin:round}
#gsvg{width:100%;height:auto;display:block;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}

/* ---------- TAB BAR ---------- */
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar)}
nav button{background:none;border:0;color:var(--bar-ink);opacity:.65;padding:10px 2px 11px;font-size:14px;font-weight:600;min-height:52px;border-top:3px solid transparent}
nav button[aria-selected="true"]{opacity:1;border-top-color:var(--accent)}
@media (max-height:500px){header{display:none}.rule{font-size:12.5px;padding:4px 12px}nav button{min-height:40px;padding:6px 2px}.panel .pbody .mini{max-width:100px}.ptitle h2{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.panel{transition:height .18s ease}}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 8px;background:var(--bar);flex:none}
.seg button{border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--bar-ink);border-radius:10px;min-height:46px;font-weight:700;font-size:15px;line-height:1.15;padding:4px 6px}
.seg button small{display:block;font-weight:500;opacity:.75;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button[aria-pressed="true"] small{opacity:.85}
body[data-tab="types"] .seg{display:none}
.alnnote{background:color-mix(in srgb,var(--aln) 12%,var(--surface));border-left:4px solid var(--aln);border-radius:8px;padding:8px 10px;font-size:14.5px;margin:4px 0 10px}
@media (max-height:500px){.seg{padding:0 8px 6px}.seg button{min-height:34px;font-size:13.5px}.seg button small{display:none}}
</style>
</head>
<body>
<header><h1>Ankraj plakaları</h1><span id="hsub">TRİBÜN ANKRAJ, 45 plaka</span></header>
<div class="seg" aria-label="İp turu">
  <button data-sys="duz" aria-pressed="true">1. tur: Düz<small>Poz 48 ve 90</small></button>
  <button data-sys="yamuk" aria-pressed="false">2. tur: Yamuk<small>Poz 49, 50 ve 51</small></button>
</div>
<main>
  <section class="view on" id="v-plan" aria-label="Plan">
    <div class="rule">Siyah nokta iki ipin kesişimine gelir. <b>Plaka oradan yukarı ve binanın ortasına açılır.</b> Gri: diğer tur.</div>
    <div class="stage">
      <div class="mapwrap">
        <svg id="map" role="img" aria-label="Ankraj yerleşim planı"></svg>
        <div class="zoom">
          <button id="zin" aria-label="Yakınlaştır">+</button>
          <button id="zout" aria-label="Uzaklaştır">−</button>
          <button id="zfit" aria-label="Tümünü göster" style="font-size:17px">⤢</button>
        </div>
        <div class="turn">Daha geniş görmek için telefonu yan çevirin</div>
      </div>
      <aside class="panel empty" id="panel" aria-live="polite"></aside>
    </div>
  </section>
  <section class="view" id="v-list" aria-label="Sıralar"><div class="scroll" id="listbox"></div></section>
  <section class="view" id="v-types" aria-label="Pozlar"><div class="scroll" id="typebox"></div></section>
  <section class="view" id="v-gonye" aria-label="Gönye"><div class="scroll" id="gonyebox"></div></section>
</main>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="plan">Plan</button>
  <button role="tab" aria-selected="false" data-v="list">Sıralar</button>
  <button role="tab" aria-selected="false" data-v="types">Pozlar</button>
  <button role="tab" aria-selected="false" data-v="gonye">Gönye</button>
</nav>

let view={s:0.02,ox:0,oy:0};
let selection=null;
function size(){const r=svg.getBoundingClientRect();return {w:r.width,h:r.height}}
function render(){
  const {w,h}=size(); if(!w||!h) return;
  svg.setAttribute('viewBox',`${view.ox} ${view.oy} ${w/view.s} ${h/view.s}`);
  const k=1/view.s, lf=view.s<0.03?0.8:1;
  scaled.forEach(o=>o.e.setAttribute('font-size',o.px*k*lf*(o.e.classList.contains('on')?1.25:1)));
  const fs=12*k*lf;
  strX.forEach((e,i)=>setLine(e,ext('x',i,fs))); strY.forEach((e,i)=>setLine(e,ext('y',i,fs)));
  hiLines.forEach(h=>h.els.forEach(e=>setLine(e,ext(h.ax,h.i,fs))));
  labX.concat(labY).forEach(l=>{if(l.e.classList.contains('on')) l.e.setAttribute('stroke-width',7*k); else l.e.removeAttribute('stroke-width');});
  const showPl=view.s>0.045;
  plates.forEach((pl,i)=>{pl.t.style.display=showPl?'':'none';
    const sel=selection&&selection.kind==='plate'&&selection.i===i; pl.dot.setAttribute('r',(sel?7:4)*k);});
  alnLabs.forEach(t=>t.style.display=view.s>0.03?'':'none');
  hiScale.forEach(o=>o.e.setAttribute(o.attr,o.px*k));
}
function fit(){
  const {w,h}=size(); const bx=-2600,by=-8000,bw=19500,bh=9900;
  view.s=Math.min(w/bw,h/bh); view.ox=bx-(w/view.s-bw)/2; view.oy=by-(h/view.s-bh)/2; render();
}
function zoomAt(f,cx,cy){
  const ns=Math.max(0.008,Math.min(1.2,view.s*f)); const mx=view.ox+cx/view.s, my=view.oy+cy/view.s;
  view.s=ns; view.ox=mx-cx/ns; view.oy=my-cy/ns; render();
}
function centerOn(x,y,s){const {w,h}=size(); if(s) view.s=s; view.ox=x-w/2/view.s; view.oy=y-h/2/view.s; render();}
$('#zin').onclick=()=>{const {w,h}=size();zoomAt(1.6,w/2,h/2)};
$('#zout').onclick=()=>{const {w,h}=size();zoomAt(1/1.6,w/2,h/2)};
$('#zfit').onclick=fit;

const pts=new Map(); let gest=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:Date.now()});
  if(pts.size===2){const [a,b]=[...pts.values()];gest={d:Math.hypot(a.x-b.x,a.y-b.y),moved:true};} else gest={moved:false};});
svg.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId); if(!p) return;
  const r=svg.getBoundingClientRect();
  if(pts.size===1){
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    if(Math.hypot(e.clientX-p.x0,e.clientY-p.y0)>8) gest.moved=true;
    if(gest.moved){view.ox-=dx/view.s; view.oy-=dy/view.s; render();}
    p.x=e.clientX;p.y=e.clientY;
  } else if(pts.size===2){
    p.x=e.clientX;p.y=e.clientY;
    const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    const cx=(a.x+b.x)/2-r.left, cy=(a.y+b.y)/2-r.top;
    if(gest.d) zoomAt(d/gest.d,cx,cy); gest.d=d; gest.moved=true;
  }
});
function up(e){
  const p=pts.get(e.pointerId); if(!p) return;
  pts.delete(e.pointerId);
  if(pts.size===0 && gest && !gest.moved && Date.now()-p.t<600){const r=svg.getBoundingClientRect(); tapAt(e.clientX-r.left,e.clientY-r.top);}
  if(pts.size===1){gest={moved:true}; const q=[...pts.values()][0]; q.x0=q.x; q.y0=q.y;}
}
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});

function tapAt(sx,sy){
  const x=view.ox+sx/view.s, y=-(view.oy+sy/view.s);
  const tol=v=>v*view.s;
  let best=null;
  plates.forEach((pl,i)=>{const b=pl.bb; const dx=Math.max(b.x0-x,0,x-b.x1), dy=Math.max(b.y0-y,0,y-b.y1); const d=Math.hypot(dx,dy);
    if(!best||d<best.d) best={d,i};});
  if(best && tol(best.d)<20){ selectPlate(best.i); return; }
  let lb=null;
  labX.forEach((l,i)=>{const d=Math.hypot(l.x-x,-l.y-y); if(!lb||d<lb.d) lb={d,ax:'x',i};});
  labY.forEach((l,i)=>{const d=Math.hypot(l.x-x,-l.y-y); if(!lb||d<lb.d) lb={d,ax:'y',i};});
  if(lb && tol(lb.d)<22){ selectString(lb.ax,lb.i); return; }
  let sb=null;
  if(y>-2000&&y<7450) D.GX.forEach((g,i)=>{const d=Math.abs(g-x); if(!sb||d<sb.d) sb={d,ax:'x',i};});
  if(x>-2600&&x<16080) D.GY.forEach((g,i)=>{const d=Math.abs(g-y); if(!sb||d<sb.d) sb={d,ax:'y',i};});
  if(sb && tol(sb.d)<14){ selectString(sb.ax,sb.i); return; }
  clearSel();
}

  const T=(title,rows)=>`<table class="gtable num"><tr><th colspan="3">${title}</th></tr>`+rows.map(r=>`<tr><td>${r[0]}</td><td class="sub">${r[1]}</td><td>${r[2]}</td></tr>`).join('')+'</table>';
  const segn=[['A','E','D','F'],['E','G','F','H'],['G','B','H','C']];
  const seg=[]; segn.forEach(([b0,b1,t0,t1],i)=>{seg.push([`${b0}${b1} / ${t0}${t1}`,'alt ve üst kenar',F.seg[i]]);seg.push([`${b0}${t1} / ${t0}${b1}`,'bölme çaprazları (eşit)',F.segd[i]]);});
  $('#gonyebox').innerHTML=`<p class="lead">${TUR(cur)}: ${D.name.toLowerCase()}. Önce çerçeve gönyeye alınır. A, sabit iplerin kesişimidir. Ölçüler mm.</p>`+s+
   T('1. Dış kenarlar',[['AB',`sabit ip (0) üstünde, 0 → ${X}`,X],['DC',`${Y} ipi üstünde, 0 → ${X}`,X],['AD',`sabit ip (0) üstünde, 0 → ${Y}`,Y],['BC',`${X} ipi üstünde, 0 → ${Y}`,Y]])+
   T('2. Büyük çaprazlar (eşit olmalı)',[['AC','A → C',F.diag],['BD','B → D',F.diag]])+
   T('3. Ara bölmeler',seg);
}

/* ---------- tur ve sekmeler ---------- */
function setSys(k){
  cur=k; D=ALL[k];
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sys===k));
  selection=null; build(); hint(); buildList(); buildGonye(); fit();
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setSys(b.dataset.sys));
function tab(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  document.body.dataset.tab=v;
  if(v==='plan') requestAnimationFrame(render);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.v));
let fitted=false;
new ResizeObserver(()=>{if(!fitted){fit();fitted=true;}else render();}).observe(svg);
build(); hint(); buildList(); buildTypes(); buildGonye();
</script>
